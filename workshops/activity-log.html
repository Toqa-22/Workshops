<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Activity Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/workshops.css">
<link rel="stylesheet" href="css/notifications.css">
<script src="js/theme-rotator.js"></script>
<script src="js/notify.js"></script>
</head>
<body>

<div class="simple-page-container">

    <div class="simple-header">
        <div class="brand-icon" aria-hidden="true">
            <img src="assets/logo.png" alt="Ibra Hospital" class="brand-logo-img">
        </div>
        <p class="simple-header-kicker">Ibra Hospital<br>Professional Development and Career Guidance</p>
        <h1>Activity Log</h1>
        <p id="courseNameLine">Enter your staff number to check in and log your sessions.</p>
    </div>

    <div class="form-card" id="staffCheckCard" style="max-width: 420px; margin: 0 auto;">
        <label style="font-size:14px; font-weight:bold; color:#334155; display:block; margin-bottom:8px;">Staff Number</label>
        <input type="text" id="staffNumberInput" placeholder="e.g. 12345" style="margin-bottom:16px;">
        <button class="btn-register" id="checkBtn" style="width:100%;">Check</button>
        <p id="checkNote" style="margin-top:16px; font-size:14px; text-align:center;"></p>
    </div>

    <div class="form-card hidden-element" id="logCard" style="max-width: 560px; margin: 0 auto;">
        <h3 id="loggedForName" style="margin-bottom:18px;"></h3>

        <div id="existingEntriesBox" style="margin-bottom:22px;"></div>

        <h4 style="margin-bottom:12px; font-size:14px; color:#334155;">Add a new entry</h4>
        <label style="font-size:13px; font-weight:bold; color:#334155; display:block; margin-bottom:6px;">Title</label>
        <input type="text" id="entryTitle" placeholder="e.g. Module 3 review" style="margin-bottom:12px;">
        <div style="display:flex; gap:10px; margin-bottom:16px;">
            <div style="flex:1;">
                <label style="font-size:13px; font-weight:bold; color:#334155; display:block; margin-bottom:6px;">Date</label>
                <input type="date" id="entryDate">
            </div>
            <div style="flex:1;">
                <label style="font-size:13px; font-weight:bold; color:#334155; display:block; margin-bottom:6px;">Time</label>
                <input type="time" id="entryTime">
            </div>
        </div>
        <button class="btn-register" id="addEntryBtn" style="width:100%;">+ Add Entry</button>
        <p id="entryNote" style="margin-top:14px; font-size:14px; text-align:center;"></p>
    </div>

</div>

<script type="module" src="js/activity-log.js"></script>
</body>
</html>
